  <div class="frame-mapa">
    <div id="mapa" aria-label="Mapa de ocorrências do bairro"></div>

    <aside class="map-overlay" aria-label="Buscar e filtrar ocorrências">
      <label class="busca">
        <span class="material-symbols-rounded" aria-hidden="true">search</span>
        <input id="buscaEndereco" type="search" placeholder="Buscar endereço no bairro…" aria-label="Buscar endereço">
      </label>

      <details class="painel-filtros map-filter-panel" open>
        <summary><span>Filtrar ocorrências</span><span id="filtroAtual">Todos</span><span class="material-symbols-rounded" aria-hidden="true">expand_more</span></summary>
        <div class="chips" id="chipsFiltro" role="group" aria-label="Filtrar por categoria"></div>
      </details>
    </aside>

      <section class="cartao-risco map-risk" aria-label="Risco do bairro agora">
        <div class="cartao-risco-corpo">
          <div class="cartao-risco-num" id="riscoNumero">…</div>
          <div class="cartao-risco-info">
            <strong>Risco do bairro agora</strong>
            <span id="riscoTendencia">…</span>
            <span class="credito">Dados fictícios.</span>
          </div>
        </div>
        <div class="risco-medidor" aria-hidden="true"><i id="riscoBarra"></i></div>
      </section>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
  <script src="js/data.js?v=farol-final-2"></script>
  <script src="js/map.js?v=farol-final-2"></script>
  <script src="js/app.js?v=farol-final-2"></script>
  <script src="js/registro.js?v=farol-final-2"></script>
  <script>
    (function () {
      var lista = Farol.ocorrencias();
      var mapa = FarolMap.criarMapa(document.getElementById('mapa'), {
        pontos: lista.map(function (o) { return [o.lat, o.lng]; }),
        padding: [60, 60],
        maxZoom: 15,
        zoomControl: true,
        zoomPosition: 'bottomright',
        scrollWheelZoom: new URLSearchParams(window.location.search).get('preview') !== '1',
      });

      var filtroCategoria = null;
      var busca = '';
      var marcadores = [];

      /* details mantém teclado/semântica nativos; só a mudança de altura é animada. */
      var filterPanel = document.querySelector('.map-filter-panel');
      var filterSummary = filterPanel.querySelector('summary');
      var filterOpen = filterPanel.open;
      var filterAnimation = null;
      filterPanel.dataset.expanded = String(filterOpen);
      filterSummary.setAttribute('aria-expanded', String(filterOpen));
      filterSummary.addEventListener('click', function (event) {
        event.preventDefault();
        var startHeight = filterPanel.getBoundingClientRect().height;
        filterOpen = !filterOpen;
        if (filterAnimation) filterAnimation.cancel();
        filterPanel.style.height = '';
        filterPanel.open = true;
        var expandedHeight = filterPanel.getBoundingClientRect().height;
        filterPanel.open = false;
        var collapsedHeight = filterPanel.getBoundingClientRect().height;
        filterPanel.open = true;
        filterPanel.dataset.expanded = String(filterOpen);
        filterSummary.setAttribute('aria-expanded', String(filterOpen));
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          filterPanel.open = filterOpen;
          filterPanel.style.overflow = '';
          filterAnimation = null;
          return;
        }
        var endHeight = filterOpen ? expandedHeight : collapsedHeight;
        filterPanel.style.overflow = 'hidden';
        filterPanel.style.height = endHeight + 'px';
        var current = filterPanel.animate([{ height: startHeight + 'px' }, { height: endHeight + 'px' }], { duration: 220, easing: 'cubic-bezier(.23, 1, .32, 1)' });
        filterAnimation = current;
        current.finished.then(function () {
          if (filterAnimation !== current) return;
          filterPanel.open = filterOpen;
          filterPanel.style.height = '';
          filterPanel.style.overflow = '';
          filterAnimation = null;
        }, function () { /* Uma nova interação retoma da altura atual. */ });
      });

      function listaFiltrada() {
        var q = busca.trim().toLowerCase();
        return lista.filter(function (o) {
          if (filtroCategoria && o.categoria !== filtroCategoria) return false;
          if (!q) return true;
          var alvo = (o.titulo + ' ' + o.enderecoAproximado + ' ' + CATEGORIAS[o.categoria].label).toLowerCase();
          return alvo.indexOf(q) !== -1;
        });
      }

      function renderizarMarcadores() {
        marcadores.forEach(function (m) { mapa.removeLayer(m); });
        marcadores = FarolMap.adicionarOcorrencias(mapa, listaFiltrada());
        document.getElementById('filtroAtual').textContent = filtroCategoria ? CATEGORIAS[filtroCategoria].label : 'Todos';
      }

      /* Chips de filtro */
      var chipsEl = document.getElementById('chipsFiltro');
      function montarChips() {
        chipsEl.innerHTML = '';
        var todos = document.createElement('button');
        todos.type = 'button';
        todos.className = 'chip ativo';
        todos.textContent = 'Todos';
        todos.setAttribute('aria-pressed', 'true');
        todos.addEventListener('click', function () {
          filtroCategoria = null;
          chipsEl.querySelectorAll('.chip').forEach(function (c) { c.classList.remove('ativo'); c.setAttribute('aria-pressed', 'false'); });
          todos.classList.add('ativo');
          todos.setAttribute('aria-pressed', 'true');
          renderizarMarcadores();
        });
        chipsEl.appendChild(todos);

        Farol.ORDEM_CATEGORIAS.forEach(function (key) {
          var cat = CATEGORIAS[key];
          var chip = document.createElement('button');
          chip.type = 'button';
          chip.className = 'chip chip-cor';
          chip.style.setProperty('--cor-cat', cat.cor);
          chip.innerHTML = '<span class="chip-ponto" aria-hidden="true"></span>' + cat.label;
          chip.setAttribute('aria-pressed', 'false');
          chip.addEventListener('click', function () {
            var jaAtivo = filtroCategoria === key;
            filtroCategoria = jaAtivo ? null : key;
            chipsEl.querySelectorAll('.chip').forEach(function (c) { c.classList.remove('ativo'); c.setAttribute('aria-pressed', 'false'); });
            if (!jaAtivo) { chip.classList.add('ativo'); chip.setAttribute('aria-pressed', 'true'); }
            else { todos.classList.add('ativo'); todos.setAttribute('aria-pressed', 'true'); }
            renderizarMarcadores();
          });
          chipsEl.appendChild(chip);
        });
      }

      /* Busca (filtra os itens fictícios) */
      document.getElementById('buscaEndereco').addEventListener('input', function (e) {
        busca = e.target.value;
        renderizarMarcadores();
      });

      /* Cartão "Risco do bairro agora" */
      function atualizarCartaoRisco() {
        var ativos = lista.filter(function (o) { return o.status !== 'resolvida'; });
        var media = ativos.length
          ? Math.round(ativos.reduce(function (s, o) { return s + o.indiceRisco; }, 0) / ativos.length)
          : 0;
        var f = Farol.riscoFaixa(media);
        var novos = lista.filter(function (o) {
          return Date.now() - new Date(o.dataHora).getTime() < 24 * 3600 * 1000;
        }).length;

        var numEl = document.getElementById('riscoNumero');
        numEl.textContent = media;
        numEl.style.setProperty('--cor-risco', f.cor);
        var barra = document.getElementById('riscoBarra');
        barra.style.width = media + '%';
        barra.style.setProperty('--cor-risco', f.cor);
        document.getElementById('riscoTendencia').textContent =
          (novos > 0 ? novos + (novos === 1 ? ' registro novo' : ' registros novos') : 'Nenhum registro novo') + ' hoje';
      }

      montarChips();
      renderizarMarcadores();
      atualizarCartaoRisco();
    })();
  </script>
</body>
</html>
